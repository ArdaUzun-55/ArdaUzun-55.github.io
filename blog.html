<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Arda Uzun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <div class="profile">
                <img id="avatar" src="a.jpg" alt="Avatar">
                <div class="profile-text">
                    <h1>Arda Uzun</h1>
                    <p>I love modding. Here are my mods for Sonny 1, 2, and 2017.</p>
                    <div class="social-links">
                        <a href="mailto:Ard4Uzun00@outlook.de">📧 Email</a>
                        <a href="https://github.com/ArdaUzun-55">🐙 GitHub</a>
                        <a href="#">💬 vastolorde3 (on Discord)</a>
                        <a href="index.html">🎮 Mods</a>
                        <a href="blog.html" style="color: #f0f6fc;">📝 Blog</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Blog Listing -->
    <main>
        <div class="container">
            <h2>📝 Blog</h2>
            <p style="color: #8b949e; margin-bottom: 20px;">
                Sharing my thoughts with y'all. To give context for some of my modding decisions.
            </p>

            <div id="blog-grid">
                <!-- Blog cards will go here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> Arda Uzun. I love modding and helping others with it too.</p>
        </div>
    </footer>

    <script>
        // ------------------------------------------------------------------
        // YOUR BLOG POSTS - Just list them here
        // ------------------------------------------------------------------
        const blogPosts = [
            {
                id: "strain-dilemma",
                title: "Diilemma regarding Strains",
                date: "2026-08-25",
                excerpt: "Balancing and strain identity... is it right?",
                tags: ["Sonny", "Modding"]
            }
            // Add more posts here
        ];

        // ------------------------------------------------------------------
        // RENDER BLOG CARDS
        // ------------------------------------------------------------------
        const grid = document.getElementById('blog-grid');
        grid.innerHTML = '';

        if (blogPosts.length === 0) {
            grid.innerHTML = '<p style="color: #8b949e;">No blog posts yet. Check back soon!</p>';
        } else {
            const posts = blogPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.innerHTML = `
                    <div class="blog-header">
                        <h3><a href="blog/${post.id}.html" style="color: #f0f6fc; text-decoration: none;">${post.title}</a></h3>
                        <span class="blog-date">${post.date}</span>
                    </div>
                    <div class="blog-tags">
                        ${post.tags ? post.tags.map(tag => `<span class="tag">#${tag}</span>`).join('') : ''}
                    </div>
                    <p class="blog-excerpt">${post.excerpt}</p>
                    <div class="blog-actions">
                        <a href="blog/${post.id}.html" class="view-btn">📖 Read More</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
